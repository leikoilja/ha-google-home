[project]
site_name = "Google Home for Home Assistant"
site_url = "https://ha-google-home.pages.dev/"
site_description = "Alarms, timers, Do Not Disturb and alarm volume for Google Home and Nest devices in Home Assistant."
repo_url = "https://github.com/leikoilja/ha-google-home"
repo_name = "leikoilja/ha-google-home"
edit_uri = "edit/master/docs/"
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "installation.md" },
    { "Entities" = "entities.md" },
    { "Actions" = "actions.md" },
    { "Automation examples" = "automations.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Community" = "community.md" },
    { "Contributing" = "contributing.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
favicon = "assets/favicon.svg"
icon.logo = "lucide/house-wifi"
features = [
    "content.action.edit",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
