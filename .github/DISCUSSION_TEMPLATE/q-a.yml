body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://ha-google-home.pages.dev/) and search the [existing discussions](https://github.com/leikoilja/ha-google-home/discussions) first. To report a bug, [open an issue](https://github.com/leikoilja/ha-google-home/issues/new/choose) instead.

        **Don't paste or attach your master token, the `oauth_token` cookie or any other token or cookie.** The master token and the cookie give access to your Google account.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to do, and what have you tried?
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: |
        Find it under the title on [**Settings** > **Devices & services** > **Google Home**](https://my.home-assistant.io/redirect/integration/?domain=google_home). Leave it empty if you haven't installed the integration yet.
      placeholder: 1.17.0
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Find it in [**Settings** > **About**](https://my.home-assistant.io/redirect/info/).
      placeholder: 2026.11.0
    validations:
      required: true
