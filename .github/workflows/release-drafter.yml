name: Draft a release note

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

# Shared with the publish workflow, see there.
concurrency:
  group: release-draft

jobs:
  draft_release:
    name: Release Drafter
    if: github.repository_owner == 'leikoilja'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run release-drafter
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
