name: Docs

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
      - .github/actions/build-docs/**

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build docs
        uses: ./.github/actions/build-docs
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error

      # Docs previews compare against this to skip PRs that don't change the site
      - name: Upload docs digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-digest
          path: digest.txt
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.repository == 'leikoilja/ha-google-home'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: docs-deploy
    environment:
      name: docs
      url: https://ha-google-home.pages.dev/
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 pages deploy site --project-name=ha-google-home --branch=master --commit-dirty=true
