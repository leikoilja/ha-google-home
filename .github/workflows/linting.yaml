name: Linting

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Hook environments (prek) and formatter plugins (dprint) are
      # downloaded on first use; both only change with their config files.
      - name: Cache prek hooks and dprint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/
            ~/.cache/dprint/
          key: >
            ${{ format('prek-{0}-{1}',
            env.PYTHON_VERSION,
            hashFiles('.pre-commit-config.yaml', 'dprint.json')
            ) }}
          restore-keys: |
            prek-${{ env.PYTHON_VERSION }}-

      - name: Run prek on all files
        run: |
          uvx prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: |
          uvx prek run --hook-stage manual python-typing-update --all-files --show-diff-on-failure --color=always

      - name: Run tests
        run: uv run pytest -q
