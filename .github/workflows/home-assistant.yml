name: Home Assistant

on:
  push:
    branches:
      - master
  pull_request:
  # Both checks run images that change upstream: hassfest's with each Home
  # Assistant beta and release, HACS's from its main branch. A daily run
  # reports a new rule on master before an unrelated PR runs into it.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    name: HACS
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: "integration"

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hassfest validation
        # Home Assistant documents tracking master; the action has no releases.
        uses: home-assistant/actions/hassfest@master
