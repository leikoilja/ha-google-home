name: Docs preview

# Runs after "Build docs" in the context of this repository, so it has the
# Cloudflare secrets even for PRs from forks. It never checks out or runs the
# PR's code: it only uploads the site that the build produced.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Build docs
    types:
      - completed

concurrency:
  group: docs-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  COMMENT_MARKER: "<!-- ha-google-home-docs-preview -->"
  STATUS_CONTEXT: Docs preview
  LIVE_URL: https://ha-google-home.pages.dev/

jobs:
  preview:
    name: Deploy preview
    if: >-
      github.repository == 'leikoilja/ha-google-home' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    steps:
      # workflow_run doesn't list PRs from forks, so find the PR by its head.
      # A build of an older commit, such as a re-run, matches no PR and is
      # skipped, so it can't replace a newer preview.
      - name: Resolve PR
        id: pr
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          PR=$(gh api "repos/${GH_REPO}/pulls?state=open" --paginate |
            jq -c --arg b "${HEAD_BRANCH}" --arg r "${HEAD_REPO}" --arg s "${HEAD_SHA}" \
              'first(.[] | select(.head.ref == $b and .head.repo.full_name == $r and .head.sha == $s) | {number, base_sha: .base.sha})')
          if [ -z "${PR}" ] || [ "${PR}" = "null" ]; then
            echo "No open PR has ${HEAD_REPO}:${HEAD_BRANCH} at ${HEAD_SHA}; nothing to preview."
            exit 0
          fi
          {
            echo "number=$(jq -r .number <<<"${PR}")"
            echo "base_sha=$(jq -r .base_sha <<<"${PR}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Set status pending
        if: steps.pr.outputs.number
        run: |
          gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="${STATUS_CONTEXT}" -f description="Deploying preview"

      - name: Download PR site
        if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR digest
        if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-digest
          path: pr-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Prefer the docs build of the PR's base commit, else the latest one
      - name: Find base digest run
        id: base
        if: steps.pr.outputs.number
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          RUN_ID=$(gh api "repos/${GH_REPO}/actions/workflows/docs.yml/runs?branch=master&head_sha=${BASE_SHA}&status=success" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "${RUN_ID}" ]; then
            RUN_ID=$(gh api "repos/${GH_REPO}/actions/workflows/docs.yml/runs?branch=master&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download base digest
        if: steps.pr.outputs.number && steps.base.outputs.run_id
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-digest
          path: base-digest
          run-id: ${{ steps.base.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare digests
        id: compare
        if: steps.pr.outputs.number
        run: |
          if [ -f base-digest/digest.txt ] && diff -q pr-digest/digest.txt base-digest/digest.txt >/dev/null 2>&1; then
            echo "unchanged=true" >> "${GITHUB_OUTPUT}"
          else
            echo "unchanged=false" >> "${GITHUB_OUTPUT}"
          fi

      # The PR controls the artifact, including through its own copy of the
      # build workflow. Wrangler would deploy a _worker.js file or folder as a
      # Worker, which would run the PR's code under the Cloudflare project.
      - name: Reject Workers in the site
        if: steps.pr.outputs.number && steps.compare.outputs.unchanged != 'true'
        run: |
          if [ -n "$(find site -maxdepth 1 -name _worker.js)" ]; then
            echo "::error::The site contains _worker.js, which Cloudflare Pages would run as a Worker."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.pr.outputs.number && steps.compare.outputs.unchanged != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ steps.pr.outputs.number }}
        run: npx --yes wrangler@4.146.0 pages deploy site --project-name=ha-google-home --branch="${BRANCH}" --commit-dirty=true

      - name: Report status
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          UNCHANGED: ${{ steps.compare.outputs.unchanged }}
        run: |
          if [ "${UNCHANGED}" = "true" ]; then
            gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state=success -f context="${STATUS_CONTEXT}" \
              -f description="No rendered changes" -f target_url="${LIVE_URL}"
          else
            gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state=success -f context="${STATUS_CONTEXT}" \
              -f description="Preview ready" -f target_url="https://pr-${NUMBER}.ha-google-home.pages.dev/"
          fi

      # Keep one comment per PR and rewrite it on each run. With no rendered
      # changes, only an earlier comment is updated, as its link is now stale.
      - name: Comment preview link
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          UNCHANGED: ${{ steps.compare.outputs.unchanged }}
        run: |
          ID=$(gh api "repos/${GH_REPO}/issues/${NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.COMMENT_MARKER))) | .id] | first // empty' | head -n1)
          UPDATED=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ "${UNCHANGED}" = "true" ]; then
            [ -z "${ID}" ] && exit 0
            BODY=$(printf '%s\nNo rendered changes: this PR matches the live docs at %s\n\n_Checked %s, updated %s_' \
              "${COMMENT_MARKER}" "${LIVE_URL}" "${HEAD_SHA:0:7}" "${UPDATED}")
          else
            BODY=$(printf '%s\n**Docs preview:** https://pr-%s.ha-google-home.pages.dev/\n\n_Built from %s, updated %s_' \
              "${COMMENT_MARKER}" "${NUMBER}" "${HEAD_SHA:0:7}" "${UPDATED}")
          fi
          if [ -n "${ID}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${ID}" -F body=@- <<<"${BODY}" >/dev/null
          else
            gh api "repos/${GH_REPO}/issues/${NUMBER}/comments" -F body=@- <<<"${BODY}" >/dev/null
          fi

      - name: Report failure
        if: failure() && steps.pr.outputs.number
        run: |
          gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state=failure -f context="${STATUS_CONTEXT}" -f description="Preview failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
