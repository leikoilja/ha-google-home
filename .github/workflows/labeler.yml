name: Labeler

on:
  pull_request_target:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    name: Triage
    if: github.repository_owner == 'leikoilja'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Pull Request Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
