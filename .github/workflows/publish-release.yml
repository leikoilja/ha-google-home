name: Publish new release

on:
  workflow_dispatch:

# Writes go through ADMIN_TOKEN, which can bypass branch protection.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  publish:
    name: Update manifest and publish
    if: github.repository_owner == 'leikoilja'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run script
        run: |
          uv run python script/publish_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
