name: Bug report
description: Report a problem with the integration.
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/leikoilja/ha-google-home/issues?q=is%3Aissue) first. If one describes your problem, add to it instead.

        **Don't paste or attach your master token, the `oauth_token` cookie or any other token or cookie.** The master token and the cookie give access to your Google account.
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did before the problem happened.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: |
        Find it under the title on [**Settings** > **Devices & services** > **Google Home**](https://my.home-assistant.io/redirect/integration/?domain=google_home). If it isn't the [latest release](https://github.com/leikoilja/ha-google-home/releases/latest), update and check that the problem still happens.
      placeholder: 1.17.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Find it in [**Settings** > **About**](https://my.home-assistant.io/redirect/info/).
      placeholder: 2026.11.0
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and System information
      description: |
        Attach the [diagnostics file](https://ha-google-home.pages.dev/troubleshooting/#download-diagnostics): **Settings** > **Devices & services** > **Google Home** > **⋮** > **Download diagnostics**. It hides credentials, tokens and IP addresses, but keeps device names and your alarms and timers, so check it first.

        Also paste the **Google Home** section of [System information](https://my.home-assistant.io/redirect/system_health/): **Settings** > **System** > **Repairs** > **⋮** > **System information**. **Copy** copies all of System information, so paste only the Google Home part. Integration versions 1.16.0 and earlier have neither the diagnostics file nor this section.
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Attach the log file. To collect debug logs, follow [Collect debug logs](https://ha-google-home.pages.dev/troubleshooting/#collect-debug-logs). If you paste lines instead, put a line of three backticks (```) before and after them.

        Debug logs can contain your email address, tokens and the IP addresses of your devices. Replace them with xxx before you post the logs.
