---
# Labels names are important as they are used by Release Drafter to decide
# regarding where to record them in changelog or if to skip them.
#
# The repository labels will be automatically configured using this file and
# the GitHub Action https://github.com/marketplace/actions/github-labeler.
# It runs on every push to master and deletes any label missing from this
# file, including labels created on GitHub. Deleting a label also removes it
# from every issue and pull request.
- name: automerge
  description: Kodiak merges the pull request once checks pass and review threads are resolved
  color: d4c5f9

- name: breaking
  description: Breaking change. Release Drafter bumps the major version
  color: b60205

- name: bug
  description: Something isn't working
  color: d73a4a

- name: dependencies
  description: Pull requests that update a dependency file
  color: 0366d6

- name: documentation
  description: Improvements or additions to documentation
  color: 0075ca

- name: feature
  description: New feature or request
  color: a2eeef

- name: github structure
  description: Changes to CI, issue forms, scripts or other repository tooling
  color: "000000"

- name: help wanted
  description: Maintainers would welcome help with this
  color: 008672

# major/minor/patch describe the dependency's version jump on Dependabot PRs.
# They do not affect this project's version: release bumps are driven by the
# "breaking" and "feature" labels, see release-drafter.yml.
- name: major
  description: Semver-major dependency update
  color: 16970B

- name: minor
  description: Semver-minor dependency update
  color: 16970B

- name: patch
  description: Semver-patch dependency update
  color: 16970B

- name: performance
  description: Makes the integration faster or use fewer resources
  color: "016175"

- name: skip-release
  description: Leaves the pull request out of the release notes
  color: "000000"

- name: question
  description: Asks how to set up or use the integration. The Question form adds it
  color: d876e3

- name: glocaltokens
  description: Involves glocaltokens, the library that gets tokens and devices from Google
  color: 0118f0

- name: refactoring
  description: Restructures code without changing what it does
  color: ef67c4

- name: removal
  description: Removes or deprecates a feature or unused code
  color: 9ae7ea

- name: testing
  description: Changes tests or test tooling only
  color: b1fc6f

- name: wontfix
  description: This will not be worked on
  color: ffffff

- name: translation
  description: Adds or updates translations
  color: eb9234
