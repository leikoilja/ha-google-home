# The release script reads the version from the last word of the name.
name-template: "RELEASE WITH GITHUB ACTIONS! v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  # PRs with this label are left out of the release notes entirely.
  - type: "pre-exclude"
    when:
      label: "skip-release"
  # major/minor/patch labels are intentionally not used for version
  # resolution: Dependabot applies them to describe the dependency's own
  # version jump, which says nothing about this integration.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "breaking"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "feature"
  - title: "🚀 Features"
    when:
      labels:
        - "feature"
        - "performance"
  - title: "🐛 Bug Fixes"
    when:
      label: "bug"
  - title: "🈵 Translations"
    when:
      label: "translation"
  - title: "📄 Documentation"
    when:
      label: "documentation"
  - title: "🧱 Dependency Updates"
    when:
      label: "dependencies"
  - title: "🔧 Internal structure enhancement"
    when:
      labels:
        - "github structure"
        - "refactoring"
        - "removal"
  - title: "🧰 Maintenance"
    when:
      label: "testing"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  default: patch
template: |
  ## Changes

  $CHANGES
